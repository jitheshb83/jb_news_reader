org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 introduced built-in Kotlin support and a new DSL, both on by default;
# opting out of both to keep using the standard org.jetbrains.kotlin.android +
# kotlin.plugin.compose plugins (still supported through AGP 9.x).
android.builtInKotlin=false
android.newDsl=false
